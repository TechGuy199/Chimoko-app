<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0b1220; color: #e7ecf5; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px; box-sizing: border-box;
        }
        .box { max-width: 380px; text-align: center; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #9aa7bd; margin: 0 0 20px; }
        button {
            padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff;
            font: inherit; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="box">
        <h1>You're offline</h1>
        <p>MS-POS needs a connection to show your inventory, sales and records. Reconnect and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
