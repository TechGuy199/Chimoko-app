{# One grouped column chart. Expects: chart (from column_chart in app.py) and title. #}
<figure class="chart">
    <figcaption>{{ title }}</figcaption>
    {% if chart.empty %}
    <p class="muted chart-empty">No activity in this period.</p>
    {% else %}
    <div class="legend">
        {% for name in chart.series %}<span><i class="swatch s{{ loop.index }}"></i>{{ name }}</span>{% endfor %}
    </div>
    <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ title }}">
        {% for t in chart.ticks %}
        <line class="grid" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ t.y }}" y2="{{ t.y }}"></line>
        <text class="tick" x="{{ chart.left - 8 }}" y="{{ t.y + 4 }}" text-anchor="end">{{ t.label }}</text>
        {% endfor %}
        {% for b in chart.bars %}<path class="bar s{{ b.series }}" d="{{ b.d }}"></path>{% endfor %}
        {% for x in chart.xlabels %}<text class="tick" x="{{ x.x }}" y="{{ chart.base + 18 }}" text-anchor="middle">{{ x.label }}</text>{% endfor %}
        {% for h in chart.hits %}<rect class="hit" x="{{ h.x }}" y="{{ chart.top }}" width="{{ h.w }}" height="{{ chart.plot_h }}" data-tip="{{ h.tip }}"></rect>{% endfor %}
    </svg>
    {% endif %}
</figure>
