{% extends "base.html" %}
{% block title %}Register — {% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Register Your Business</h1>
    <p class="muted">These details appear on invoices. You become the admin account.</p>
    <form method="post">
        {{ csrf_field() }}
        <label>Company / business name <input name="business_name" required autofocus></label>
        <label>Subtitle / TPIN / registration number <input name="subtitle"></label>
        <label>Contact / address <input name="contact"></label>
        <label>Admin username <input name="username" required autocomplete="username"></label>
        <label>Password (8 characters or more) <input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
        <label>Repeat password <input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
        <button class="btn success wide">Create Account</button>
    </form>
    <p class="muted center"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
