{% extends "base.html" %}
{% block title %}Login — {% endblock %}
{% block content %}
<div class="card narrow">
    <img class="brand-mark" src="{{ asset('icons/icon.svg') }}" alt="" width="56" height="56">
    <h1>Sign in to MS-POS</h1>
    <form method="post">
        {{ csrf_field() }}
        <label>Username <input name="username" required autofocus autocomplete="username"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary wide">Login</button>
    </form>
    <p class="muted center">
        {% if signup_open %}<a href="{{ url_for('setup') }}">Register a new business</a><span class="sep"> · </span>{% endif %}
        <a href="{{ url_for('setup', demo=1) }}">Try a free 24-hour demo</a>
    </p>
</div>
{% endblock %}
