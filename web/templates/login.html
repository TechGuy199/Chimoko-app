{% extends "base.html" %}
{% block title %}Login — {% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Secure POS Login</h1>
    <form method="post">
        {{ csrf_field() }}
        <label>Username <input name="username" required autofocus autocomplete="username"></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary wide">Login</button>
    </form>
    <p class="muted center">
        {% if signup_open %}<a href="{{ url_for('setup') }}">Register a new business</a> · {% endif %}
        <a href="{{ url_for('setup', demo=1) }}">Try a free 24-hour demo</a>
    </p>
</div>
{% endblock %}
